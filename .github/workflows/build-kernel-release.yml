name: Build and Release OnePlus Kernels

run-name: >-
  ${{ github.event.inputs.op_target_model != '' && github.event.inputs.op_target_model || github.event.inputs.op_model }}
  • RSKSU
  • ${{ github.event.inputs.build_timestamp != '' && github.event.inputs.build_timestamp || 'auto timestamp' }}

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: |
          Release mode:
          no = artifacts only.
          tag_only = create tag + upload review files.
          release = create tag + publish release.
        required: true
        type: choice
        options:
          - no
          - tag_only
          - release
        default: no

      op_model:
        description: |
          Build target group:
          OOS groups = OS/COS compatibility groups.
          androidXX-X.Y = exact Android/kernel base filter.
        required: true
        type: choice
        options:
          - OOS14+15+16
          - OOS15+16
          - OOS14+15
          - OOS16
          - OOS15
          - OOS14
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android12-5.10
        default: OOS14+15+16

      op_target_model:
        description: |
          Optional filter. Empty = all matching configs.
          Examples: OP12, OP13-CPH, OP-NORD-4, OP12-6.1.
          Full version like OP12-6.1.118 requires kernel_full_version in config.
        required: false
        type: string
        default: ''

      ksu_options:
        description: |
          ReSukiSU JSON ref. One entry only.
          Example: [{"type":"rsksu","hash":"main"}]
        required: true
        type: string
        default: '[{"type":"rsksu","hash":"main"}]'

      optimize_level:
        description: 'Compiler optimization: O2 = recommended, O3 = aggressive.'
        required: true
        type: choice
        options:
          - O2
          - O3
        default: O2

      clean_build:
        description: 'true = disable ccache and rebuild from scratch.'
        required: false
        type: boolean
        default: false

      debug:
        description: 'Upload extra logs/debug artifacts. Increases artifact size.'
        required: false
        type: boolean
        default: false

      mirror_toolchains:
        description: 'true = sync toolchains before build; useful for first run/cache refresh.'
        required: false
        type: boolean
        default: false

      build_timestamp:
        description: 'Optional uname timestamp (ie: Tue Feb 10 10:01:02 UTC 2026). Empty = current UTC time.'
        required: false
        type: string
        default: ''

      enable_adios:
        description: 'Enable ADIOS I/O scheduler for supported 6.1/6.6 kernels.'
        required: false
        type: boolean
        default: false

      android12-5_10_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android12-5.10'
        required: false
        type: string
        default: ''

      android13-5_15_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android13-5.15'
        required: false
        type: string
        default: ''

      android14-6_1_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android14-6.1'
        required: false
        type: string
        default: ''

      android15-6_6_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android15-6.6'
        required: false
        type: string
        default: ''

      android16-6_12_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android16-6.12'
        required: false
        type: string
        default: ''

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.device_count }}
      job_count: ${{ steps.set-matrix.outputs.count }}
      active_gki_keys: ${{ steps.set-matrix.outputs.active_gki_keys }}
      susfs_hash_android12_5_10: ${{ steps.set-matrix.outputs.susfs_hash_android12_5_10 }}
      susfs_hash_android13_5_15: ${{ steps.set-matrix.outputs.susfs_hash_android13_5_15 }}
      susfs_hash_android14_6_1: ${{ steps.set-matrix.outputs.susfs_hash_android14_6_1 }}
      susfs_hash_android15_6_6: ${{ steps.set-matrix.outputs.susfs_hash_android15_6_6 }}
      susfs_hash_android16_6_12: ${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}
      ksu_resolved_hash: ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
      susfs_base_version: ${{ steps.set-matrix.outputs.susfs_base_version }}

    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600

    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: 🔍 Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"

          input="${{ github.event.inputs.op_model }}"
          target_model="${{ github.event.inputs.op_target_model }}"
          ksu_options_raw='${{ github.event.inputs.ksu_options }}'

          if ! ksu_options_normalized=$(echo "$ksu_options_raw" | jq -c '
            map(
              if .type then
                .type |= ascii_upcase
                | if .hash == null or .hash == "" then
                    if .type == "RSKSU" then
                      .hash = "main"
                    else
                      error("This branch only supports RSKSU. Got: " + .type)
                    end
                  else
                    .
                  end
              else
                error("No type found")
              end
            )
          ' 2>&1); then
            echo "::error::ksu_options validation failed: $ksu_options_normalized"
            exit 1
          fi

          {
            echo "ksu_options_normalized<<EOF"
            echo "$ksu_options_normalized"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          ksu_count="$(echo "$ksu_options_normalized" | jq 'length')"

          if [ "$ksu_count" -ne 1 ]; then
            echo "::error::Only one ReSukiSU option is currently supported. Got $ksu_count entries."
            echo "::error::Please use exactly one entry, for example: [{\"type\":\"rsksu\",\"hash\":\"main\"}]"
            exit 1
          fi

          ksu_type="$(echo "$ksu_options_normalized" | jq -r '.[0].type')"
          ksu_ref="$(echo "$ksu_options_normalized" | jq -r '.[0].hash')"

          if [ "$ksu_type" != "RSKSU" ]; then
            echo "::error::This branch only supports RSKSU. Got: $ksu_type"
            exit 1
          fi

          mapfile -d '' -t all_json_files < <(find configs/ -name "*.json" -print0)

          if [ "${#all_json_files[@]}" -eq 0 ]; then
            echo "::error::No config JSON files found under configs/"
            exit 1
          fi

          jq -s '
            map(
              if type == "array" then .[]
              elif type == "object" then .
              else empty
              end
            )
          ' "${all_json_files[@]}" > matrix.json

          jq_filter="."

          case "$input" in
            OOS14+15+16)
              ;;
            OOS15+16)
              jq_filter="map(select(.os_version == \"OOS15\" or .os_version == \"OOS16\"))"
              ;;
            OOS14+15)
              jq_filter="map(select(.os_version == \"OOS14\" or .os_version == \"OOS15\"))"
              ;;
            OOS16)
              jq_filter="map(select(.os_version == \"OOS16\"))"
              ;;
            OOS15)
              jq_filter="map(select(.os_version == \"OOS15\"))"
              ;;
            OOS14)
              jq_filter="map(select(.os_version == \"OOS14\"))"
              ;;
            android*-*.*)
              IFS='-' read -r av kv <<< "$input"
              jq_filter="map(select(.os_version == \"OOS15\" or .os_version == \"OOS16\")) | map(select(.android_version == \"$av\" and .kernel_version == \"$kv\"))"
              echo "ℹ️ Android-Kernel filter applied: $av-$kv"
              echo "   Restricted to: OOS15/OOS16 compatibility groups"
              ;;
            *)
              echo "::warning::Unknown input '$input'. Using empty filter."
              jq_filter="map(select(false))"
              ;;
          esac

          filtered="$(jq -c "$jq_filter" matrix.json)"

          if [ -n "$target_model" ]; then
            echo "🎯 Target model filter enabled: $target_model"
            echo "   Matching exact model, model prefix, or model + kernel base/full-version where available."

            filtered="$(echo "$filtered" | jq -c --arg target "$target_model" '
              map(
                select(
                  .model == $target
                  or (.model | startswith($target + "-"))
                  or ((.model + "-" + .kernel_version) == $target)
                  or ((.model + "-" + .android_version + "-" + .kernel_version) == $target)
                  or ((.model + "-" + (.kernel_full_version // "")) == $target)
                  or ((.model + "-" + .android_version + "-" + (.kernel_full_version // "")) == $target)
                )
              )
            ')"
          else
            echo "ℹ️ No target model selected. Building all configs matching op_model='$input'."
          fi

          device_count="$(jq 'length' <<< "$filtered")"

          filtered="$(echo "$filtered" | jq '
            sort_by(
              (.os_version | gsub("OOS"; "") | tonumber) * -1,
              .model
            )
          ')"

          if [ "$device_count" -eq 0 ]; then
            echo "::error::No config files found for op_model='$input' and op_target_model='${target_model:-<empty>}' after applying filters!"
            echo ""
            echo "Available configurations:"
            jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version))"' matrix.json
            exit 1
          fi

          merged_matrix="$(jq -n --argjson devices "$filtered" --argjson ksu_list "$ksu_options_normalized" '
            [
              $devices[] as $dev
              | $ksu_list[] as $ksu
              | ($dev + {ksu_type: $ksu.type, ksu_hash: $ksu.hash})
            ]
          ')"

          final_count="$(echo "$merged_matrix" | jq 'length')"

          echo "✅ Found $final_count build job(s)"
          echo ""
          echo "Selected devices:"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<< "$merged_matrix"

          echo "count=$final_count" >> "$GITHUB_OUTPUT"
          echo "device_count=$device_count" >> "$GITHUB_OUTPUT"

          KSU_REPO_OWNER="ReSukiSU"
          KSU_REPO_NAME="ReSukiSU"

          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"

          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5

          echo "Resolving $ksu_type hash ($ksu_ref) from $KSU_REPO_OWNER/$KSU_REPO_NAME..."

          until [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; do
            RESULT="$(gh api graphql \
              -f query="$QUERY" \
              -f owner="$KSU_REPO_OWNER" \
              -f name="$KSU_REPO_NAME" \
              -f headRef="$HEAD_REF" \
              -f tagRef="$TAG_REF" \
              -f objRef="$ksu_ref" 2>/dev/null || true)"

            if [ -n "$RESULT" ]; then
              echo "  ✅ API Success"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
            sleep "$RETRY_DELAY"
          done

          if [ "$RETRY_COUNT" -eq "$MAX_RETRIES" ]; then
            echo "::error::GitHub API unreachable. Cannot validate $ksu_ref"
            exit 1
          fi

          resolved_sha="$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")')"

          if [ "$resolved_sha" = "unknown" ]; then
            echo "::error::Ref/Hash '$ksu_ref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
            exit 1
          fi

          echo "  ✅ Resolved: $ksu_type/$ksu_ref → $resolved_sha"
          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"

          merged_matrix="$(echo "$merged_matrix" | jq --arg resolved_sha "$resolved_sha" '
            map(.ksu_resolved_hash = $resolved_sha)
          ')"

          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"

          declare -A default_branches=(
            ["android12-5.10"]="gki-android12-5.10"
            ["android13-5.15"]="gki-android13-5.15"
            ["android14-6.1"]="gki-android14-6.1"
            ["android15-6.6"]="gki-android15-6.6"
            ["android16-6.12"]="gki-android16-6.12"
          )

          declare -A user_inputs=(
            ["android12-5.10"]="${{ inputs.android12-5_10_susfs_branch_or_commit }}"
            ["android13-5.15"]="${{ inputs.android13-5_15_susfs_branch_or_commit }}"
            ["android14-6.1"]="${{ inputs.android14-6_1_susfs_branch_or_commit }}"
            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"
            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"
          )

          mapfile -t active_keys < <(
            echo "$merged_matrix" \
              | jq -r '.[] | select(.susfs == true or .susfs == "true") | "\(.android_version)-\(.kernel_version)"' \
              | sort -u
          )

          echo "🔍 Resolving SUSFS hashes for: ${active_keys[*]:-none}"

          declare -A susfs_hashes
          declare -A susfs_versions_per_key

          for key in "${active_keys[@]}"; do
            default_val="${default_branches[$key]}"
            user_val="${user_inputs[$key]:-$default_val}"

            HASH_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } } } }"
            RELEASE_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } blobs(paths: [\"kernel_patches/include/linux/susfs.h\"], ref: \"${user_val}\") { nodes { rawBlob } } } } }"

            if [ "${{ inputs.make_release }}" = "release" ] || [ "${{ inputs.make_release }}" = "tag_only" ]; then
              GL_QUERY="$RELEASE_QUERY"
            else
              GL_QUERY="$HASH_QUERY"
            fi

            MAX_RETRIES=3
            RETRY_COUNT=0
            RETRY_DELAY=5
            resolved=""

            until [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; do
              RESPONSE="$(curl -s --fail -G "https://gitlab.com/api/graphql" --data-urlencode "query=$GL_QUERY" || true)"

              if [ -n "$RESPONSE" ]; then
                resolved="$(echo "$RESPONSE" | jq -r '.data.project.repository.ch.sha // empty')"

                if [ -n "$resolved" ] && [ "$resolved" != "null" ]; then
                  echo "  ✅ Query for $key Success"

                  if [ "${{ inputs.make_release }}" = "release" ] || [ "${{ inputs.make_release }}" = "tag_only" ]; then
                    extracted="$(echo "$RESPONSE" | jq -r '.data.project.repository.blobs.nodes[0].rawBlob // empty' | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}' || true)"
                    susfs_versions_per_key[$key]="${extracted:-unknown}"
                    echo "  ✅ $key → SUSFS_VERSION = ${extracted:-unknown}"
                  fi

                  break
                fi
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "::warning::GitLab GraphQL API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying..."
              sleep "$RETRY_DELAY"
            done

            if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
              echo "::error::Could not resolve SUSFS ref '$user_val' for $key on GitLab."
              exit 1
            fi

            if { [ "${{ inputs.make_release }}" = "release" ] || [ "${{ inputs.make_release }}" = "tag_only" ]; } \
              && [ "${susfs_versions_per_key[$key]:-unknown}" = "unknown" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for '$key'. Cannot proceed with tag/release."
              exit 1
            fi

            susfs_hashes["$key"]="$resolved"
            echo "  ✅ Resolved: $key → $resolved"
          done

          active_gki_keys_csv="$(IFS=','; echo "${active_keys[*]:-}")"
          echo "active_gki_keys=$active_gki_keys_csv" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android12_5_10=${susfs_hashes[android12-5.10]:-unknown}" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android13_5_15=${susfs_hashes[android13-5.15]:-unknown}" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android14_6_1=${susfs_hashes[android14-6.1]:-unknown}" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android15_6_6=${susfs_hashes[android15-6.6]:-unknown}" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android16_6_12=${susfs_hashes[android16-6.12]:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.make_release }}" = "release" ] || [ "${{ inputs.make_release }}" = "tag_only" ]; then
            susfs_base_version="unknown"

            for key in "${active_keys[@]}"; do
              ver="${susfs_versions_per_key[$key]:-unknown}"
              if [ "$ver" != "unknown" ]; then
                susfs_base_version="$ver"
                break
              fi
            done

            if [ "$susfs_base_version" = "unknown" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for any active GKI key."
              exit 1
            fi

            for key in "${active_keys[@]}"; do
              key_ver="${susfs_versions_per_key[$key]:-unknown}"
              if [ "$key_ver" != "$susfs_base_version" ]; then
                echo "::error::SUSFS version mismatch: '$key' has '$key_ver', expected '$susfs_base_version'. Align refs before releasing."
                exit 1
              fi
            done

            echo "susfs_base_version=$susfs_base_version" >> "$GITHUB_OUTPUT"
          else
            echo "susfs_base_version=none" >> "$GITHUB_OUTPUT"
          fi

          susfs_hashes_json="$(jq -n \
            --arg a12 "${susfs_hashes[android12-5.10]:-unknown}" \
            --arg a13 "${susfs_hashes[android13-5.15]:-unknown}" \
            --arg a14 "${susfs_hashes[android14-6.1]:-unknown}" \
            --arg a15 "${susfs_hashes[android15-6.6]:-unknown}" \
            --arg a16 "${susfs_hashes[android16-6.12]:-unknown}" \
            '{
              "android12-5.10": $a12,
              "android13-5.15": $a13,
              "android14-6.1":  $a14,
              "android15-6.6":  $a15,
              "android16-6.12": $a16
            }'
          )"

          merged_matrix="$(echo "$merged_matrix" | jq \
            --argjson hashes "$susfs_hashes_json" \
            '[.[] | . + {susfs_resolved_hash: ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")}]'
          )"

          merged_matrix="$(echo "$merged_matrix" | jq '
            sort_by(
              (.os_version | gsub("OOS"; "") | tonumber? // 0) * -1,
              .model
            )
          ')"

          echo "$merged_matrix" | jq '.' > matrix.json

          wrapped="$(jq -n --argjson items "$merged_matrix" '{ include: $items }')"
          echo "matrix=$(jq -c . <<< "$wrapped")" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          retention-days: 7

      - name: 📊 Build plan summary
        shell: bash
        run: |
          set -euo pipefail

          ksu_type="${{ fromJSON(steps.set-matrix.outputs.ksu_options_normalized)[0].type }}"
          ksu_ref="${{ fromJSON(steps.set-matrix.outputs.ksu_options_normalized)[0].hash }}"

          if [[ "$ksu_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            ksu_display="📌 \`$ksu_type\`, \`$ksu_ref\`"
          else
            ksu_display="🔀 \`$ksu_type\`, \`$ksu_ref\` → \`${{ steps.set-matrix.outputs.ksu_resolved_hash }}\`"
          fi

          target_model_input="${{ inputs.op_target_model }}"
          if [ -z "$target_model_input" ]; then
            target_model_display="All configs matching selected target"
          else
            target_model_display="\`$target_model_input\`"
          fi

          build_ts_input="${{ inputs.build_timestamp }}"
          if [ -z "$build_ts_input" ]; then
            build_ts_display="⏱️ auto, current UTC build time"
          else
            build_ts_display="📌 \`$build_ts_input\`"
          fi

          case "${{ inputs.make_release }}" in
            release)  release_display="🚀 release — tag + publish immediately" ;;
            tag_only) release_display="🏷️ tag_only — tag created, release pending review" ;;
            *)        release_display="❌ no — artifacts only" ;;
          esac

          clean_display="${{ inputs.clean_build && '✅ Yes' || '❌ No' }}"
          debug_display="${{ inputs.debug && '✅ Yes' || '❌ No' }}"
          adios_display="${{ inputs.enable_adios && '✅ Yes' || '❌ No' }}"
          mirror_display="${{ inputs.mirror_toolchains && '✅ Yes' || '❌ No' }}"

          device_count="${{ steps.set-matrix.outputs.device_count }}"
          job_count="${{ steps.set-matrix.outputs.count }}"

          os_breakdown="$(jq -r '
            sort_by(.os_version)
            | group_by(.os_version)
            | map("\(.[0].os_version): \(length)")
            | join(", ")
          ' matrix.json)"

          kernel_breakdown="$(jq -r '
            sort_by(.android_version, .kernel_version)
            | group_by(.android_version + "-" + .kernel_version)
            | map("\(.[0].android_version)-\(.[0].kernel_version): \(length)")
            | join(", ")
          ' matrix.json)"

          soc_breakdown="$(jq -r '
            sort_by(.soc)
            | group_by(.soc)
            | map("\(.[0].soc): \(length)")
            | join(", ")
          ' matrix.json)"

          lto_breakdown="$(jq -r '
            sort_by(.lto)
            | group_by(.lto)
            | map("\(.[0].lto): \(length)")
            | join(", ")
          ' matrix.json)"

          susfs_breakdown="$(jq -r '
            sort_by(.susfs)
            | group_by(.susfs)
            | map("\(.[0].susfs): \(length)")
            | join(", ")
          ' matrix.json)"

          {
            cat << EOF
          ## 🎯 Build Plan

          This run will build the selected OnePlus kernel configuration set below.

          | Item | Value |
          |---|---|
          | **Target Selection** | \`${{ inputs.op_model }}\` |
          | **Target Model Filter** | $target_model_display |
          | **Selected Devices** | \`${device_count}\` |
          | **Build Jobs** | \`${job_count}\` |
          | **ReSukiSU Ref** | $ksu_display |
          | **Build Timestamp** | $build_ts_display |
          | **Optimization** | \`${{ inputs.optimize_level }}\` |
          | **Clean Build / No ccache** | $clean_display |
          | **Release Mode** | $release_display |
          | **Debug Artifacts** | $debug_display |
          | **ADIOS I/O Scheduler** | $adios_display |
          | **Sync Toolchains** | $mirror_display |

          ---

          ## 🧩 SUSFS Resolution

          EOF
          } >> "$GITHUB_STEP_SUMMARY"

          declare -A susfs_inputs=(
            ["android12-5.10"]="${{ inputs.android12-5_10_susfs_branch_or_commit }}"
            ["android13-5.15"]="${{ inputs.android13-5_15_susfs_branch_or_commit }}"
            ["android14-6.1"]="${{ inputs.android14-6_1_susfs_branch_or_commit }}"
            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"
            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"
          )

          declare -A step_hashes=(
            ["android12-5.10"]="${{ steps.set-matrix.outputs.susfs_hash_android12_5_10 }}"
            ["android13-5.15"]="${{ steps.set-matrix.outputs.susfs_hash_android13_5_15 }}"
            ["android14-6.1"]="${{ steps.set-matrix.outputs.susfs_hash_android14_6_1 }}"
            ["android15-6.6"]="${{ steps.set-matrix.outputs.susfs_hash_android15_6_6 }}"
            ["android16-6.12"]="${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}"
          )

          IFS=',' read -ra active_keys_display <<< "${{ steps.set-matrix.outputs.active_gki_keys }}"

          if [ -z "${{ steps.set-matrix.outputs.active_gki_keys }}" ]; then
            echo "No active SUSFS-enabled GKI keys were selected for this build." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "| GKI Key | Input Ref | Resolved Commit |"
              echo "|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            for key in "${active_keys_display[@]}"; do
              [ -z "$key" ] && continue

              value="${susfs_inputs[$key]:-}"
              fetched_hash="${step_hashes[$key]:-unknown}"

              if [ -z "$value" ]; then
                input_display="auto default branch"
              else
                input_display="\`$value\`"
              fi

              echo "| \`$key\` | $input_display | \`$fetched_hash\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          {
            cat << EOF

          > **💡 Note:** ReSukiSU and SUSFS refs are resolved before builds start, so every build job receives pinned commit hashes.

          ---

          ## 📦 Selected Build Matrix

          **Jobs:** \`${job_count}\`  
          **OS compatibility breakdown:** \`${os_breakdown}\`  
          **Kernel breakdown:** \`${kernel_breakdown}\`  
          **SoC breakdown:** \`${soc_breakdown}\`  
          **LTO breakdown:** \`${lto_breakdown}\`  
          **SUSFS breakdown:** \`${susfs_breakdown}\`

          <details>
          <summary>📋 Expand full selected build matrix — ${job_count} job(s)</summary>

          | # | Model | OS Group | Kernel | SoC | SUSFS | LTO | Branch |
          |---:|---|---|---|---|---|---|---|
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            to_entries[]
            | "| \(.key + 1) | `\(.value.model)` | `\(.value.os_version)` | `\(.value.android_version)-\(.value.kernel_version)` | `\(.value.soc)` | `\(.value.susfs)` | `\(.value.lto)` | `\(.value.branch)` |"
          ' matrix.json >> "$GITHUB_STEP_SUMMARY"

          {
            cat << EOF

          </details>

          ---

          ## ✅ Pre-build Notes

          - Confirm the **model**, **OS compatibility group**, and **kernel base** before flashing any resulting ZIP.
          - Labels such as \`OOS14/OOS15/OOS16\` also correspond to compatible \`COS14/COS15/COS16\` builds.
          - A build job count higher than device count means the matrix was expanded.
          - This workflow currently enforces **one ReSukiSU configuration per run**.
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$job_count" -ge 10 ]; then
            {
              echo ""
              echo "> **⚠️ Large Build Notice:** This run contains \`${job_count}\` build jobs. It may take a long time and consume significant runner minutes."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ inputs.clean_build }}" = "true" ]; then
            {
              echo ""
              echo "> **♻️ Clean Build Notice:** ccache is disabled for this run, so builds may be slower but cleaner."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ inputs.debug }}" = "true" ]; then
            {
              echo ""
              echo "> **🧪 Debug Notice:** Debug artifacts/logs are enabled. Artifact size may be larger."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${{ inputs.op_model }}" == android*-*.* ]]; then
            {
              echo ""
              echo "> **⚠️ Android-Kernel Filter:** Only OOS15/OOS16 compatibility groups are included for \`${{ inputs.op_model }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ inputs.make_release }}" = "tag_only" ]; then
            {
              echo ""
              echo "> **🏷️ Tag-Only Mode:** A tag will be created after builds complete, but no release will be published. Review artifacts then publish manually."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  mirror_toolchain:
    needs: set-op-model
    if: ${{ inputs.mirror_toolchains }}
    uses: ./.github/workflows/mirror-toolchains.yml
    secrets: inherit

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        shell: bash
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/ccache/ccache-x86-64"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS \
              --connect-timeout 30 \
              --max-time 120 \
              -H "User-Agent: Mozilla/5.0" \
              "$url" -o ccache && [ -s ccache ]; then
              ok=1
              break
            fi
            echo "attempt $attempt failed (GitHub raw 504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            chmod +x ccache
            echo "✅ downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ccache
          fi
          echo "::endgroup::"

      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})
    needs:
      - set-op-model
      - mirror_toolchain
      - prepare_ccache
    if: |
      always() &&
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.mirror_toolchain.result) &&
      contains(fromJSON('["success","skipped"]'), needs.prepare_ccache.result)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    outputs:
      rsksu_ver: ${{ steps.build-stat.outputs.rsksu_ver }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup == true }}
        uses: ./.github/actions/disk-cleanup

      - name: Install Minimal Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        if: ${{ inputs.clean_build == false || inputs.clean_build == 'false' }}
        uses: actions/download-artifact@v8
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache (shared artifact → ECS fallback → apt)
        shell: bash
        if: ${{ inputs.clean_build == false || inputs.clean_build == 'false' }}
        run: |
          set -uo pipefail
          echo "::group::Install ccache"

          # ── Priority 1: shared artifact from prepare_ccache ──────────────
          if [ -s ccache-dl/ccache ]; then
            chmod +x ccache-dl/ccache
            if file ccache-dl/ccache | grep -qiE 'ELF|executable' && \
               ccache-dl/ccache --version >/dev/null 2>&1; then
              sudo install -m 0755 ccache-dl/ccache /usr/bin/ccache
              echo "✅ installed custom ccache from shared artifact"
              rm -rf ccache-dl
              echo "[DEBUG] ccache version: $(ccache --version | head -1)"
              echo "::endgroup::"
              exit 0
            fi
            echo "::warning::shared artifact binary invalid; trying per-job download"
          fi
          rm -rf ccache-dl

          # ── Priority 2: per-job download (fallback) ───────────────────────
          CUSTOM_CCACHE_URLS=(
            "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/ccache/ccache-x86-64"
            "https://github.com/WildKernels/kernel_patches/raw/main/ccache/ccache-x86-64"
            "https://github.com/WildKernels/kernel_patches/raw/refs/heads/main/ccache/ccache-x86-64"
          )

          TMP_DIR="$(mktemp -d)"
          TMP_CCACHE="$TMP_DIR/ccache"
          CUSTOM_CCACHE_OK=false

          cleanup() { rm -rf "$TMP_DIR" || true; }
          trap cleanup EXIT

          for url in "${CUSTOM_CCACHE_URLS[@]}"; do
            echo "Trying per-job ccache URL: $url"
            rm -f "$TMP_CCACHE"

            if curl -LfsS \
              --retry 5 \
              --retry-delay 8 \
              --retry-max-time 180 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 180 \
              -H "User-Agent: Mozilla/5.0" \
              -H "Accept: application/octet-stream,*/*" \
              "$url" -o "$TMP_CCACHE" && [ -s "$TMP_CCACHE" ]; then

              chmod +x "$TMP_CCACHE"
              if file "$TMP_CCACHE" | grep -qiE 'ELF|executable' && \
                 "$TMP_CCACHE" --version >/dev/null 2>&1; then
                sudo install -m 0755 "$TMP_CCACHE" /usr/bin/ccache
                CUSTOM_CCACHE_OK=true
                echo "✅ Custom ECS ccache installed from per-job download"
                break
              fi
            fi
            sleep 3
          done

          # ── Priority 3: apt ccache (already installed) ────────────────────
          if [ "$CUSTOM_CCACHE_OK" != "true" ]; then
            echo "::warning::Custom ccache unavailable. Using apt ccache."
          fi

          if ! command -v ccache >/dev/null 2>&1 || ! ccache --version >/dev/null 2>&1; then
            echo "::error::ccache is still unavailable after all fallbacks"
            exit 1
          fi

          echo "[DEBUG] ccache path: $(command -v ccache)"
          ccache --version | head -1 || true
          echo "::endgroup::"

      - name: ♻️ Configure ccache & LTO cache (bounded)
        shell: bash
        if: ${{ inputs.clean_build == false || inputs.clean_build == 'false' }}
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail

          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            LDCACHE_DIR="${{ github.workspace }}/.ld_cache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"

            mkdir -p "$CACHE_DIR" "$LDCACHE_DIR"

            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "LDCACHE_DIR=$LDCACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )

            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done

            if [ "${{ inputs.debug }}" = "true" ]; then
              export "CCACHE_LOGFILE=$CCACHE_LOG"
              echo "CCACHE_LOGFILE=$CCACHE_LOG" >> "$GITHUB_ENV"
            fi

            echo "✅ ccache configured successfully"
            ccache -p
          else
            echo "ccache not found, skipping configuration."
          fi

          echo "::endgroup::"

      - name: 🧹 Prepare op_config_json (without workflow-only fields)
        id: prepare_config
        shell: bash
        run: |
          set -euo pipefail
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash, .susfs_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: 🔨 Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          build_timestamp: ${{ inputs.build_timestamp }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          enable_adios: ${{ inputs.enable_adios }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        shell: bash
        run: |
          echo "::group::Build Statistics"

          echo "Device: ${{ matrix.model }}"
          echo "OS Group: ${{ matrix.os_version }}"
          echo "Kernel: ${{ matrix.android_version }}-${{ matrix.kernel_version }}"
          echo "Timestamp: ${{ steps.build.outputs.build_timestamp }}"
          echo "Status: ${{ job.status }}"

          if [ "${{ matrix.susfs }}" = "true" ]; then
            echo "SUSFS Hash: ${{ matrix.susfs_resolved_hash }}"
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully"
            echo ""
            echo "Outputs:"
            echo "  - Kernel: ${{ steps.build.outputs.kernel_version }}"
            echo "  - ReSukiSU: v${{ steps.build.outputs.ksu_version }}"
            echo "  - Timestamp: ${{ steps.build.outputs.build_timestamp }}"
            echo "rsksu_ver=${{ steps.build.outputs.ksu_version }}" >> "$GITHUB_OUTPUT"

            if [ "${{ matrix.susfs }}" = "true" ]; then
              echo "  - SUSFS: ${{ steps.build.outputs.susfs_version }}"
            fi

            echo "  - Build time: ${{ steps.build.outputs.build_time }}s"

            if [ "${{ inputs.clean_build }}" != "true" ]; then
              echo "  - ccache hit rate: ${{ steps.build.outputs.ccache_hit_rate }}"
              echo "  - ccache direct rate: ${{ steps.build.outputs.ccache_direct_rate }}"
            else
              echo "  - ccache: disabled (clean build)"
            fi

            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "  - Warnings: ${{ steps.build.outputs.warnings }}"
            fi
          else
            echo "❌ Build failed"
          fi

          echo "::endgroup::"

      - name: 📝 Job summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ### ${{ matrix.model }} (${{ matrix.os_version }}) - ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}

          **Kernel:** ${{ matrix.android_version }}-${{ matrix.kernel_version }}  
          **Timestamp:** \`${{ steps.build.outputs.build_timestamp }}\`  
          **ADIOS I/O Scheduler:** \`${{ inputs.enable_adios }}\`
          EOF

          if [ "${{ matrix.susfs }}" = "true" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << EOF
          **SUSFS Hash:** \`${{ matrix.susfs_resolved_hash }}\`
          EOF
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | Metric | Value |
          |--------|-------|
          | **Kernel** | ${{ steps.build.outputs.kernel_version }} |
          | **ReSukiSU** | v${{ steps.build.outputs.ksu_version }} |
          | **Build Timestamp** | \`${{ steps.build.outputs.build_timestamp }}\` |
          EOF

            if [ "${{ matrix.susfs }}" = "true" ]; then
              cat >> "$GITHUB_STEP_SUMMARY" << EOF
          | **SUSFS** | ${{ steps.build.outputs.susfs_version }} |
          EOF
            fi

            cat >> "$GITHUB_STEP_SUMMARY" << EOF
          | **Build Time** | ${{ steps.build.outputs.build_time }}s |
          EOF

            if [ "${{ inputs.clean_build }}" != "true" ]; then
              cat >> "$GITHUB_STEP_SUMMARY" << EOF
          | **ccache Hit Rate** | ${{ steps.build.outputs.ccache_hit_rate }} |
          | **ccache Direct Rate** | ${{ steps.build.outputs.ccache_direct_rate }} |
          EOF
            fi

            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "| **Warnings** | ${{ steps.build.outputs.warnings }} |" >> "$GITHUB_STEP_SUMMARY"
            fi

            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          **Image SHA256:** \`${{ steps.build.outputs.image_sha256 }}\`  
          **AnyKernel3 Zip SHA256:** \`${{ steps.build.outputs.zip_sha256 }}\`
          EOF
          fi

      - name: 🧹 Final cleanup and space report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Cleanup"

          sudo rm -rf "$GITHUB_WORKSPACE/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/build" || true
          sudo rm -rf "$GITHUB_WORKSPACE/kernel/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/.repo" || true
          sudo rm -rf /tmp/* || true

          if [ "${{ inputs.clean_build }}" != "true" ] && command -v ccache >/dev/null 2>&1; then
            echo ""
            echo "📊 ccache statistics after build:"
            ccache -s || true
            echo ""
            echo "💾 ccache preserved for next build"
          fi

          echo ""
          echo "💽 Final disk usage:"
          df -h / || true

          echo "::endgroup::"

  trigger-release:
    needs:
      - set-op-model
      - build
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      (inputs.make_release == 'release' || inputs.make_release == 'tag_only') &&
      needs.build.result == 'success' &&
      needs.set-op-model.result == 'success'
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUSFS_BASE_VERSION: ${{ needs.set-op-model.outputs.susfs_base_version }}
      RELEASE_NAME: 'ReSukiSU 📦 SUSFS ${{ needs.set-op-model.outputs.susfs_base_version }} • ${{ inputs.op_model }}'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Generate and Create New Tag
        shell: bash
        run: |
          set -euo pipefail

          TAG_PREFIX="susfs-${SUSFS_BASE_VERSION}-rsksu"

          LATEST_MATCHING_TAG="$(
            gh api --paginate "repos/$REPO_OWNER/$REPO_NAME/tags?per_page=100" \
              --jq "
                [
                  .[]
                  | select(.name | test(\"^\" + \"${TAG_PREFIX}\" + \"-r[0-9]+\$\"))
                ]
                | sort_by(
                    .name
                    | split(\"-r\") | last | tonumber
                  )
                | last
                | .name // empty
              "
          )"

          echo "Latest matching tag: '${LATEST_MATCHING_TAG:-<none>}'"

          if [ -z "$LATEST_MATCHING_TAG" ]; then
            NEW_TAG="${TAG_PREFIX}-r1"
          else
            CURRENT_N="$(echo "$LATEST_MATCHING_TAG" | grep -oE '[0-9]+$')"
            if [[ ! "$CURRENT_N" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not extract revision number from tag: '$LATEST_MATCHING_TAG'"
              exit 1
            fi
            NEW_TAG="${TAG_PREFIX}-r$(( CURRENT_N + 1 ))"
          fi

          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

          TRIGGER_SHA="${{ github.sha }}"
          echo "Tagging commit: $TRIGGER_SHA"

          gh api \
            --method POST \
            "repos/$REPO_OWNER/$REPO_NAME/git/refs" \
            --field "ref=refs/tags/${NEW_TAG}" \
            --field "sha=${TRIGGER_SHA}"

          echo "✅ Tag ${NEW_TAG} created via API (no git push)"

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true

      - name: 🔐 Generate Checksums
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t AK3_ZIPS < <(find ./downloaded-artifacts -name "AK3_*.zip" -type f | sort)

          if [ "${#AK3_ZIPS[@]}" -eq 0 ]; then
            echo "::error::No AK3 ZIP artifacts found."
            find ./downloaded-artifacts -maxdepth 4 -type f | sort || true
            exit 1
          fi

          echo "Found ${#AK3_ZIPS[@]} AK3 ZIP(s):"
          printf '  %s\n' "${AK3_ZIPS[@]}"

          sha256sum "${AK3_ZIPS[@]}" \
            | awk '{n=split($2,a,"/"); print $1"  "a[n]}' \
            | sort -k2 > 00_CHECKSUMS.txt

          echo "Generated 00_CHECKSUMS.txt:"
          cat 00_CHECKSUMS.txt

      - name: 📥 Generate Downloads Index
        shell: bash
        run: |
          set -euo pipefail

          MATRIX_FILE="$(find ./downloaded-artifacts -name "matrix.json" -type f | head -n1)"
          mapfile -t ALL_AK3_ZIPS < <(find ./downloaded-artifacts -name "AK3_*.zip" -type f | sort)

          {
            echo "# 📥 OnePlus Kernel Downloads"
            echo ""
            echo "> Select the ZIP matching your exact **device**, **OS version**, and **kernel base**."
            echo ""

            if [ "${{ inputs.make_release }}" = "tag_only" ]; then
              echo "> 🏷️ **Tag-only mode:** direct download links become valid only after you manually create the release and upload the assets."
              echo ""
            fi

            echo "## 🎯 Find Your ZIP in 3 Steps"
            echo ""
            echo "| Step | What to check | Where to find it |"
            echo "|------|--------------|------------------|"
            echo "| **1. Device model** | Match your exact model name | \`Settings → About Phone → Model\` |"
            echo "| **2. OS version** | Match \`OOS14\` / \`OOS15\` / \`OOS16\` to your firmware | \`Settings → About Phone → Software Version\` |"
            echo "| **3. Kernel base** | Match \`android15-6.6.XX\` to your current kernel | \`Settings → About Phone → Kernel Version\` |"
            echo ""
            echo "> ⚠️ **Flashing the wrong ZIP may cause bootloop.** When in doubt, check all three steps before downloading."
            echo ""
            echo "---"
            echo ""
            echo "## 🧾 How to read the ZIP name"
            echo ""
            echo "Example: \`AK3_OP12_OOS15_android15-6.6.30_RSKSU_31234_SuSFS_v2.2.0.zip\`"
            echo ""
            echo "| Part | Meaning |"
            echo "|------|---------|"
            echo "| \`OP12\` | Device/model family |"
            echo "| \`OOS15\` | OS compatibility group — also covers compatible COS15-based builds |"
            echo "| \`android15-6.6.30\` | Android common kernel base and exact kernel version |"
            echo "| \`RSKSU_31234\` | ReSukiSU type and build number |"
            echo "| \`SuSFS_v2.2.0\` | SUSFS version included in the kernel |"
            echo ""
            echo "---"
            echo ""
          } > 00_DOWNLOADS.md

          get_feature_list() {
            local row="$1"
            local features=""

            if [ -z "$row" ]; then
              echo "standard"
              return 0
            fi

            features="$(
              echo "$row" | jq -r '
                [
                  (if (.bbr == true or .bbr == "true") then "BBR" else empty end),
                  (if (.bbg == true or .bbg == "true") then "BBG" else empty end),
                  (if (.hmbird == true or .hmbird == "true") then "HMBIRD" else empty end),
                  (if (.ttl == true or .ttl == "true") then "TTL" else empty end),
                  (if (.ip_set == true or .ip_set == "true") then "IP_SET" else empty end),
                  (if (.unicode == true or .unicode == "true") then "Unicode Fix" else empty end),
                  (if (.ntsync == true or .ntsync == "true") then "NTSync" else empty end),
                  (if (.ds == true or .ds == "true") then "Droidspaces" else empty end),
                  (if (.rust_build == true or .rust_build == "true") then "Rust Binder" else empty end)
                ] | join(", ")
              '
            )"

            [ -z "$features" ] && features="standard"

            if [ "${{ inputs.enable_adios }}" = "true" ]; then
              [ "$features" = "standard" ] && features="ADIOS" || features="${features}, ADIOS"
            fi

            echo "$features"
          }

          find_matrix_row() {
            local model="$1" os_version="$2" kernel_version="$3"

            [ -n "$MATRIX_FILE" ] && [ -f "$MATRIX_FILE" ] || return 0

            jq -c \
              --arg model "$model" \
              --arg os "$os_version" \
              --arg kernel "$kernel_version" '
                .[]?
                | select(
                    (.model? == $model or (.model? | startswith($model + "-")) or ($model | startswith((.model? // "") + "-")))
                    and .os_version? == $os
                    and ((.android_version? + "-" + .kernel_version?) == $kernel)
                  )
              ' "$MATRIX_FILE" 2>/dev/null | head -n1
          }

          parse_zip_name() {
            local zipname="$1"
            local rest="${zipname#AK3_}"
            local -a parts
            IFS='_' read -ra parts <<< "$rest"

            local model="" os_version="" kernel_version="" ksu_type="" ksu_ver=""
            local susfs_ver="none"
            local model_done=false
            local i=0

            for part in "${parts[@]}"; do
              if [ "$model_done" = "false" ]; then
                if [[ "$part" =~ ^OOS[0-9]+$ ]] || [[ "$part" =~ ^android[0-9]+-[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                  model_done=true
                  os_version="$part"
                  i=$(( i + 1 ))
                  continue
                fi
                [ -n "$model" ] && model="${model}_${part}" || model="$part"
              else
                case $i in
                  1) kernel_version="$part" ;;
                  2) ksu_type="$part" ;;
                  3) ksu_ver="$part" ;;
                  4) [ "$part" = "SuSFS" ] && susfs_ver="pending" || true ;;
                  5) [ "${susfs_ver}" = "pending" ] && susfs_ver="$part" || true ;;
                esac
                i=$(( i + 1 ))
              fi
            done

            PARSED_MODEL="$model"
            PARSED_OS="$os_version"
            PARSED_KERNEL="$kernel_version"
            PARSED_KSU_TYPE="$ksu_type"
            PARSED_KSU_VER="$ksu_ver"
            PARSED_SUSFS_VER="$susfs_ver"
          }

          for os in OOS16 OOS15 OOS14; do
            mapfile -t files < <(
              printf '%s\n' "${ALL_AK3_ZIPS[@]}" \
                | grep "_${os}_" | sort
            )

            [ "${#files[@]}" -eq 0 ] && continue

            os_number="${os#OOS}"

            {
              echo "## ${os} / COS${os_number} compatibility group"
              echo ""
              echo "> These builds target \`${os}\` firmware. For some regional devices, this also covers compatible **COS${os_number}** firmware/kernel sources."
              echo ""
              echo "### 🎯 Match your device — ${os} / COS${os_number}"
              echo ""
              echo "| # | Device | OS Group | Kernel Base | Root & SUSFS | Optional Features | Download | SHA256 |"
              echo "|---|--------|----------|-------------|--------------|-------------------|----------|--------|"
            } >> 00_DOWNLOADS.md

            idx=0
            for file in "${files[@]}"; do
              idx=$(( idx + 1 ))
              name="$(basename "$file")"
              zipname="${name%.zip}"

              parse_zip_name "$zipname"
              model="$PARSED_MODEL"
              os_version="$PARSED_OS"
              kernel_version="$PARSED_KERNEL"
              ksu_type="$PARSED_KSU_TYPE"
              ksu_ver="$PARSED_KSU_VER"
              susfs_ver="$PARSED_SUSFS_VER"

              susfs_display="❌ none"
              if [ "$susfs_ver" != "none" ] && [ "$susfs_ver" != "pending" ] && [ -n "$susfs_ver" ]; then
                susfs_display="✅ ${susfs_ver}"
              fi

              row="$(find_matrix_row "$model" "$os_version" "$kernel_version" || true)"
              features="$(get_feature_list "$row")"

              sha="$(sha256sum "$file" | awk '{print $1}')"
              short_sha="${sha:0:12}"
              asset_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${name}"

              echo "| ${idx} | \`${model}\` | \`${os_version}\` / \`COS${os_number}\`* | \`${kernel_version}\` | \`${ksu_type}-${ksu_ver}\`, ${susfs_display} | \`${features}\` | [⬇️ Download](${asset_url}) | \`${short_sha}...\` |" \
                >> 00_DOWNLOADS.md
            done

            {
              echo ""
              echo "\\* COS compatibility depends on your exact device/region/kernel source. Always match the kernel base before flashing."
              echo ""
              echo "---"
              echo ""
            } >> 00_DOWNLOADS.md
          done

          {
            echo "## 🔐 Verify Your Download"
            echo ""
            echo "Download \`00_CHECKSUMS.txt\` from this release and run:"
            echo ""
            echo '```bash'
            echo "sha256sum -c 00_CHECKSUMS.txt"
            echo '```'
            echo ""
            echo "All files should report \`OK\`."
            echo ""
            echo "---"
            echo ""
            echo "## 🔐 Recommended Apps"
            echo ""
            echo "| Purpose | App | Link |"
            echo "|---------|-----|------|"
            echo "| Root manager | ReSukiSU Manager | https://github.com/ReSukiSU/ReSukiSU/releases |"
            echo "| SUSFS userspace module | KSU SUSFS Module | https://github.com/sidex15/ksu_module_susfs/releases |"
            echo "| Kernel flashing | Kernel Flasher | https://github.com/fatalcoder524/KernelFlasher/releases |"
            echo ""
            echo "---"
            echo ""
            echo "## 🧯 Rollback / Recovery"
            echo ""
            echo "If the device bootloops after flashing:"
            echo ""
            echo "1. Boot to fastboot or recovery."
            echo "2. Flash your backed-up stock \`boot\`/\`init_boot\`/\`vendor_boot\` image."
            echo "3. Reboot normally."
            echo "4. Report the exact ZIP filename, device model, OS version, and kernel base."
          } >> 00_DOWNLOADS.md

          echo "Generated 00_DOWNLOADS.md:"
          cat 00_DOWNLOADS.md

      - name: 📝 Generate Device List and Final Release Notes
        id: generate-notes
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Start building the release notes ==="

          declare -A device_info

          parse_zip_name() {
            local zipname="$1"
            local rest="${zipname#AK3_}"
            local -a parts
            IFS='_' read -ra parts <<< "$rest"

            local model="" os_version="" kernel_version="" ksu_type="" ksu_ver=""
            local susfs_ver="none"
            local model_done=false
            local i=0

            for part in "${parts[@]}"; do
              if [ "$model_done" = "false" ]; then
                if [[ "$part" =~ ^OOS[0-9]+$ ]] || [[ "$part" =~ ^android[0-9]+-[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                  model_done=true
                  os_version="$part"
                  i=$(( i + 1 ))
                  continue
                fi
                [ -n "$model" ] && model="${model}_${part}" || model="$part"
              else
                case $i in
                  1) kernel_version="$part" ;;
                  2) ksu_type="$part" ;;
                  3) ksu_ver="$part" ;;
                  4) [ "$part" = "SuSFS" ] && susfs_ver="pending" || true ;;
                  5) [ "${susfs_ver}" = "pending" ] && susfs_ver="$part" || true ;;
                esac
                i=$(( i + 1 ))
              fi
            done

            PARSED_MODEL="$model"
            PARSED_OS="$os_version"
            PARSED_KERNEL="$kernel_version"
            PARSED_KSU_TYPE="$ksu_type"
            PARSED_KSU_VER="$ksu_ver"
            PARSED_SUSFS_VER="$susfs_ver"
          }

          mapfile -t ALL_AK3_ZIPS < <(find ./downloaded-artifacts -name "AK3_*.zip" -type f | sort)

          for file in "${ALL_AK3_ZIPS[@]}"; do
            zipname="$(basename "$file" .zip)"

            parse_zip_name "$zipname"
            model="$PARSED_MODEL"
            os_version="$PARSED_OS"
            kernel_version="$PARSED_KERNEL"
            ksu_type_asset="$PARSED_KSU_TYPE"
            ksu_ver="$PARSED_KSU_VER"
            susfs_ver="$PARSED_SUSFS_VER"
            [ "$susfs_ver" = "pending" ] && susfs_ver="unknown"

            file_name="$(basename "$file")"
            full_model="${model}_${os_version}_${kernel_version}"
            device_info["$full_model"]="$model|$os_version|$kernel_version|$ksu_type_asset|$ksu_ver|$susfs_ver|$file_name"
          done

          if [ "${#device_info[@]}" -eq 0 ]; then
            echo "::error::No device ZIPs found!"
            exit 1
          fi

          ksu_ref="${{ fromJSON(needs.set-op-model.outputs.ksu_options_normalized)[0].hash }}"
          ksu_resolved_hash="${{ needs.set-op-model.outputs.ksu_resolved_hash }}"

          OPTIMIZE_LEVEL="${{ inputs.optimize_level }}"
          CLEAN_BUILD="${{ inputs.clean_build }}"
          BUILD_TIMESTAMP_INPUT="${{ inputs.build_timestamp }}"

          declare -A susfs_map=(
            ["android12-5.10"]="${{ needs.set-op-model.outputs.susfs_hash_android12_5_10 }}"
            ["android13-5.15"]="${{ needs.set-op-model.outputs.susfs_hash_android13_5_15 }}"
            ["android14-6.1"]="${{ needs.set-op-model.outputs.susfs_hash_android14_6_1 }}"
            ["android15-6.6"]="${{ needs.set-op-model.outputs.susfs_hash_android15_6_6 }}"
            ["android16-6.12"]="${{ needs.set-op-model.outputs.susfs_hash_android16_6_12 }}"
          )

          IFS=',' read -ra active_gki_keys <<< "${{ needs.set-op-model.outputs.active_gki_keys }}"

          first_entry="$(printf '%s\n' "${!device_info[@]}" | sort | head -n1)"
          IFS='|' read -r _ _ _ _ ksu_ver_global _ _ <<< "${device_info[$first_entry]}"

          ksu_display_value() {
            local input="$1" resolved="$2"
            [[ "$input" =~ ^[0-9a-fA-F]{40}$ ]] && echo "$input" || echo "$input ($resolved)"
          }

          ksu_display="$(ksu_display_value "$ksu_ref" "$ksu_resolved_hash")"

          cat << EOF > release_notes.md
          # 📱 OOS/COS • ReSukiSU • SUSFS ${SUSFS_BASE_VERSION}

          Flashable AnyKernel3 ZIPs for supported OnePlus devices.

          > ⚠️ **Important:** Match your exact **device model**, **OS version**, and **kernel base** before flashing.
          > The workflow uses labels like \`OOS14/OOS15/OOS16\`, **ColorOS/COS 14/15/16**.

          ---

          ## 📥 Downloads first

          Open this release asset: **➡️ \`00_DOWNLOADS.md\`**

          It contains the grouped download table with device/model, OS compatibility group,
          kernel base, ReSukiSU/SUSFS version, optional features, direct download link,
          and short SHA256 checksum.

          ---

          ## 🧾 How to read the ZIP name

          Example: \`AK3_OP12_OOS15_android15-6.6.30_RSKSU_31234_SuSFS_v2.2.0.zip\`

          | Part | Meaning |
          |---|---|
          | \`OP12\` | Device/model family |
          | \`OOS15\` | OS compatibility group. May also correspond to compatible COS15-based builds |
          | \`android15-6.6.30\` | Android common kernel base and kernel version |
          | \`RSKSU_31234\` | ReSukiSU type and build/version |
          | \`SuSFS_v2.2.0\` | SUSFS version included in the kernel |

          ---

          ## ✅ Read before flashing

          - Download only the ZIP matching your **device**, **OS version**, and **kernel base**.
          - Do **not** flash a ZIP just because the device name looks similar.
          - Flashing the wrong kernel may cause bootloop.
          - Back up your current boot/init_boot/vendor_boot partitions.
          - Keep a stock boot/init_boot image ready for rollback.
          - If switching from Magisk, APatch, KernelSU, ReSukiSU, or another fork, clean old root leftovers carefully.

          ---

          ## 📘 Quick installation

          1. Open \`00_DOWNLOADS.md\`.
          2. Download the matching ZIP.
          3. Verify the checksum if possible.
          4. Flash using Kernel Flasher or another trusted flashing method.
          5. Reboot.
          6. Install/update ReSukiSU Manager.
          7. Install the SUSFS module if you need SUSFS userspace features.

          ---

          ## 🔐 Recommended apps

          | Purpose | App | Link |
          |---|---|---|
          | Root manager | ReSukiSU Manager | https://github.com/ReSukiSU/ReSukiSU/releases |
          | SUSFS userspace module | KSU SUSFS Module | https://github.com/sidex15/ksu_module_susfs/releases |
          | Kernel flashing | Kernel Flasher | https://github.com/fatalcoder524/KernelFlasher/releases |

          ---

          ## 📦 Release helper files

          | File | Purpose |
          |---|---|
          | \`00_DOWNLOADS.md\` | Main grouped download index |
          | \`00_CHECKSUMS.txt\` | Full SHA256 checksums |

          ---

          ## 📦 Built Devices (${#device_info[@]} total)

          | Model | OS Group | Kernel Base | Root | SUSFS | File |
          |---|---|---|---|---|---|
          EOF

          for full_key in $(printf '%s\n' "${!device_info[@]}" | sort); do
            IFS='|' read -r model os_ver kernel_ver ksu_type_asset ksu_ver susfs_ver file_name \
              <<< "${device_info[$full_key]}"
            asset_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${file_name}"

            os_display="$os_ver"
            if [[ "$os_ver" == OOS* ]]; then
              os_num="${os_ver#OOS}"
              os_display="${os_ver}/COS${os_num}"
            fi

            echo "| \`${model}\` | \`${os_display}\` | \`${kernel_ver}\` | \`${ksu_type_asset}-${ksu_ver}\` | \`${susfs_ver}\` | [Download](${asset_url}) |" \
              >> release_notes.md
          done

          cat << EOF >> release_notes.md

          ---

          ## 🔧 Build Configuration

          | Component | Version/Setting |
          |---|---|
          | **Root Solution** | \`ReSukiSU\` |
          | **ReSukiSU Ref** | \`${ksu_display}\` |
          | **ReSukiSU Version** | \`${ksu_ver_global}\` |
          | **SUSFS Version** | \`${SUSFS_BASE_VERSION}\` |
          | **Optimization Level** | \`${OPTIMIZE_LEVEL}\` |
          | **Clean Build** | $( [ "$CLEAN_BUILD" = "true" ] && echo "✅ Yes (no ccache)" || echo "❌ No (ccache enabled)" ) |
          | **Build Timestamp Input** | \`${BUILD_TIMESTAMP_INPUT:-auto}\` |
          | **Compiler** | Clang, version may vary by device source/toolchain |
          | **Workflow Run** | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ---

          ## 📌 SUSFS Branch Mapping

          | Kernel Version | SUSFS Commit |
          |---|---|
          EOF

          for key in "${active_gki_keys[@]}"; do
            [ -z "$key" ] && continue
            echo "| \`${key}\` | \`${susfs_map[$key]:-unknown}\` |" >> release_notes.md
          done

          cat << EOF >> release_notes.md

          ---

          ## ✨ Included Features

          ### 🔐 Root Management

          - **ReSukiSU** kernel-level root solution.
          - **SUSFS ${SUSFS_BASE_VERSION}** hiding/spoofing support where enabled.
          - SUSFS userspace features require the matching SUSFS module.

          ### 🛡️ SUSFS / Privacy Features

          Depending on device/kernel support, builds may include:

          - SUS_PATH, SUS_MOUNT, SUS_KSTAT, SUS_MAP
          - SPOOF_UNAME, SPOOF_CMDLINE / BOOTCONFIG
          - OPEN_REDIRECT
          - AVC spoofing where supported
          - Ptrace leak fix for kernels below 5.16
          - Unicode path bypass fix where enabled

          ### 🚀 Performance & Networking

          Depending on device config, builds may include:

          - BBR TCP congestion control
          - IP_SET and IPv6 NAT
          - TTL target support
          - LTO build optimization
          - TMPFS_XATTR and TMPFS_POSIX_ACL
          - ADIOS I/O scheduler if enabled for this workflow run
          - Memory, TCP, F2FS, CPU scheduler and I/O performance patches

          ### 🔧 Optional Device Features

          Depending on device config, builds may include:

          - HMBIRD SCX
          - Baseband Guard / BBG
          - Droidspaces
          - NTSync
          - Rust Binder support

          ---

          ## 🔐 Verify downloads

          Download \`00_CHECKSUMS.txt\` and run:

          \`\`\`bash
          sha256sum -c 00_CHECKSUMS.txt
          \`\`\`

          ---

          ## 🧯 Rollback / recovery

          If the device bootloops:

          1. Boot to fastboot/recovery.
          2. Restore your backed-up stock boot/init_boot image.
          3. Reboot.
          4. Report the exact ZIP filename, device model, OS version, and kernel base.

          ---

          ## 📜 Changelog

          - Built OnePlus kernel ZIPs with ReSukiSU.
          - Included SUSFS ${SUSFS_BASE_VERSION} where enabled.
          - Added tag_only release mode — create tag, review artifacts, publish later.
          - Fixed tag generation regex to avoid tonumber error on "rsksu" substring.
          - Fixed ZIP name parsing to handle model names containing underscores.
          - Improved release download organization with grouped index.
          - Added SHA256 checksum file and direct download links.
          - Added OOS/COS compatibility wording for regional builds.
          - Added single-device build targeting with \`op_target_model\`.
          - Improved ccache build system: shared artifact via prepare_ccache job eliminates parallel throttling.
          - Added LTO cache.
          - Added IP_SET, IPv6 NAT, TTL, TMPFS_XATTR, TMPFS_POSIX_ACL where enabled.
          - Added Ptrace leak fix for kernels below 5.16.
          - Added Unicode bypass fix, Droidspaces, NTSync where enabled.
          - Added optional ADIOS I/O scheduler support for 6.1 and 6.6 kernels.
          - Added performance patches: memory, TCP, F2FS, CPU scheduler, I/O tuning.
          - Compiler optimization: ${OPTIMIZE_LEVEL}.
          - Fixed ccache-binary and extracted kernel files appearing in release assets.
          - Fixed AK3 ZIP detection with recursive find for merge-multiple artifact layout.

          ---

          ## 🙏 Credits

          - **ReSukiSU Team** - root solution
          - **simonpunk** - SUSFS development
          - **OnePlus / OPPO / ColorOS kernel source contributors** - kernel source code
          - **Community contributors and testers**

          ---

          **⚡ Built with care for the Android kernel community**
          EOF

          echo "--- Final Release Notes ---"
          cat release_notes.md

      - name: 📤 Upload release review files
        if: ${{ inputs.make_release == 'tag_only' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-review-files-${{ env.NEW_TAG }}
          path: |
            release_notes.md
            00_DOWNLOADS.md
            00_CHECKSUMS.txt
          retention-days: 14

      - name: 🚀 Create GitHub Release
        if: ${{ inputs.make_release == 'release' }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ env.NEW_TAG }}" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_notes.md

      - name: 📤 Upload Release Assets Dynamically
        if: ${{ inputs.make_release == 'release' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Uploading helper files..."
          for helper in 00_DOWNLOADS.md 00_CHECKSUMS.txt; do
            if [ -f "$helper" ]; then
              echo "Uploading $helper..."
              gh release upload "${{ env.NEW_TAG }}" "$helper" \
                --clobber \
                --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}"
            fi
          done

          echo "Uploading kernel ZIPs..."
          mapfile -t UPLOAD_ZIPS < <(find ./downloaded-artifacts -name "AK3_*.zip" -type f | sort)

          if [ "${#UPLOAD_ZIPS[@]}" -eq 0 ]; then
            echo "::error::No AK3 ZIPs found to upload."
            exit 1
          fi

          for file in "${UPLOAD_ZIPS[@]}"; do
            echo "Uploading $(basename "$file")..."
            gh release upload "${{ env.NEW_TAG }}" "$file" \
              --clobber \
              --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}"
          done

      - name: 🏷️ Tag-only summary
        if: ${{ inputs.make_release == 'tag_only' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Tag created: ${{ env.NEW_TAG }}"
          echo "No release published — tag_only mode."

          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ---

          ## 🏷️ Tag Created — Release Pending Your Review

          **Tag:** [\`${{ env.NEW_TAG }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }})

          The tag has been pushed. **No release has been published yet.**

          ### ✅ When you are happy with the artifacts

          **Option A — GitHub UI (recommended):**
          1. Go to **Releases → Draft a new release**
          2. Choose existing tag: \`${{ env.NEW_TAG }}\`
          3. Paste the release notes from the \`release_notes.md\` artifact
          4. Upload the ZIPs from the workflow artifacts
          5. Publish

          **Option B — Re-run this workflow with \`release\` mode:**
          - Set \`make_release\` → \`release\`
          - The same tag prefix will auto-increment to the next revision

          **Option C — GitHub CLI:**
          \`\`\`bash
          gh release create ${{ env.NEW_TAG }} \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_notes.md \
            ./downloaded-artifacts/AK3_*.zip \
            00_DOWNLOADS.md \
            00_CHECKSUMS.txt
          \`\`\`

          ### 📦 Artifacts available in this run

          Download them from the **Actions → This run → Artifacts** section before they expire.

          EOF

      - name: 📊 Release summary
        if: ${{ inputs.make_release == 'release' && success() }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SUMMARY_ZIPS < <(find ./downloaded-artifacts -name "AK3_*.zip" -type f | sort)
          kernel_count="${#SUMMARY_ZIPS[@]}"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ---

          ## 🎉 Release Created Successfully

          **Tag:** [\`${{ env.NEW_TAG }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }})
          **Release:** ${{ env.RELEASE_NAME }}
          **Kernels:** ${kernel_count}

          ### 📘 User Download Helpers

          - \`00_DOWNLOADS.md\` - grouped downloads by OS compatibility group
          - \`00_CHECKSUMS.txt\` - SHA256 checksums

          ### 📦 Assets
          EOF

          echo "- \`00_DOWNLOADS.md\` — grouped downloads by OS compatibility group" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`00_CHECKSUMS.txt\` — SHA256 checksums" >> "$GITHUB_STEP_SUMMARY"

          for zip in "${SUMMARY_ZIPS[@]}"; do
            name="$(basename "$zip")"
            size="$(stat -c%s "$zip")"
            size_mb="$(awk -v s="$size" 'BEGIN{printf "%.2f", s / 1024 / 1024}')"
            echo "- \`$name\` (${size_mb} MB)" >> "$GITHUB_STEP_SUMMARY"
          done
